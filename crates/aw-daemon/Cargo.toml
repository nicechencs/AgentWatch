[package]
name = "aw-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "agentwatchd: config, logging, single-instance lock, and in-process shutdown."

[[bin]]
name = "agentwatchd"
path = "src/main.rs"

[dependencies]
aw-core = { workspace = true }
aw-pipeline = { workspace = true }
aw-store = { workspace = true }
aw-proxy = { workspace = true }
aw-agent-adapters = { workspace = true }
aw-collector-poll = { workspace = true }
aw-collector-linux = { workspace = true }
aw-collector-windows = { workspace = true }
aw-collector-macos = { workspace = true }
# Pinned in this crate (not workspace.dependencies): root Cargo.toml is out of
# scope for P1-DAEMON-01. Versions match crates that already use them.
# serde/serde_json/thiserror/toml are MIT OR Apache-2.0. tracing is MIT.
# tracing's `log` feature is off so we do not pull the `log` crate.
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
thiserror = { version = "2.0.20", default-features = false }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
# Re-exported by tracing, but this crate names tracing_core types in its subscriber.
# MIT. Pinned here, not in [workspace.dependencies].
tracing-core = { version = "0.1.36", default-features = false, features = ["std"] }

[lints]
workspace = true
