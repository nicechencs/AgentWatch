# Built-in sensitive-path rules. security-privacy.md §4.
#
# `~` is the session user's home, expanded by the pipeline, not by this file.
# `exclude` globs are matched against the same path and suppress the hit.
# A rule with `platform = "any"` applies on every platform. Platform-specific
# rows of the same id are additional shapes, not replacements.
#
# This file is data. The pipeline does not read a file at runtime from a
# configurable path; `include_str!` compiles it in. User rules arrive through
# `[sensitive_paths]` config and cannot remove a rule listed here.

[[rule]]
id = "ssh-keys"
platform = "any"
glob = "~/.ssh/**"
exclude = ["~/.ssh/**/*.pub", "~/.ssh/known_hosts", "~/.ssh/known_hosts.*"]

[[rule]]
id = "ssh-keys"
platform = "windows"
glob = "~\\.ssh\\**"
exclude = ["~\\.ssh\\**\\*.pub", "~\\.ssh\\known_hosts", "~\\.ssh\\known_hosts.*"]

