[package]
name = "aw-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "AgentWatch operating-system boundary for launch, process identity, and local security."

[features]
test-hold-delay = []

[target.'cfg(target_os = "linux")'.dependencies]
# Already used by aw-daemon and present in Cargo.lock. It provides safe waitpid.
nix = { version = "0.30", default-features = false, features = ["fs", "process", "socket", "user"] }
aw-collector-linux = { path = "../aw-collector-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
# `getpeereid` and `LOCAL_PEERPID` provide authenticated Unix-socket peer
# credentials without an FFI boundary in this crate.
nix = { version = "0.30", default-features = false, features = ["user", "socket"] }
aw-collector-macos = { path = "../aw-collector-macos" }

[target.'cfg(windows)'.dependencies]
aw-collector-windows = { path = "../aw-collector-windows" }
# The pinned package and these feature flags are already represented in the
# workspace lockfile.  Keep Win32 FFI at this OS boundary.
windows = { version = "=0.57.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
[lints.rust]
# The Windows implementation has narrowly-scoped, documented FFI exceptions.
# `forbid` cannot be relaxed in that child module.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
