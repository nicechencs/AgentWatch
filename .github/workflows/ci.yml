# P0-CI-02: three-OS compile/test gate plus license, advisory, and doc-link jobs.
# No repository secrets. Signing stays out of this workflow (P4).
# wording-lint added by P3-CI-01, UI checks by P0-CI-04. Size checks stay in P4.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Manual run of the 3-OS gate on a chosen ref (e.g. the dev tip):
  #   gh workflow run ci.yml --ref dev
  workflow_dispatch:

concurrency:
  # Pull requests: a new push drops the previous run on the same ref.
  # Pushes and manual workflow_dispatch runs never cancel each other: each
  # gets its own group (run_id), so every dispatched dev tip keeps a result.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Save the cache from main only so PR branches do not fill the cache.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: daemon cannot use its own identity
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/check-daemon-current-user.sh
      - name: cargo test
        run: cargo test --workspace --no-fail-fast
      # Review 14:40: `aw daemon uninstall --purge --data-dir` exists only in
      # test builds (feature test-purge-data-dir). Run its own tests with the
      # feature, then prove the RELEASE binary rejects the flag and leaves an
      # ordinary directory in place.
      - name: purge --data-dir is test-build only
        shell: bash
        run: |
          cargo test -p aw-cli --features test-purge-data-dir --bin aw uninstall_
          cargo build --release -p aw-cli --bin aw
          dir="$RUNNER_TEMP/aw-purge-release-check"
          mkdir -p "$dir/nested" && echo keep > "$dir/nested/keep"
          if target/release/aw daemon uninstall --purge --data-dir "$dir"; then
            echo "release aw accepted --data-dir"; exit 1
          fi
          test -f "$dir/nested/keep" || { echo "release aw deleted the directory"; exit 1; }
          echo "release aw rejected --data-dir; directory kept"
      # macOS: these two crates' tests must actually run. `cargo test
      # --workspace` above includes them; this step prints their names so a
      # green log shows macos::launch::tests, macos::tests and macos::spawn::tests
      # as ok, not skipped by cfg.
      - name: macOS platform and daemon tests
        if: runner.os == 'macOS'
        run: cargo test -p aw-platform -p aw-daemon -- --nocapture
      - name: root daemon tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo_bin="$(command -v cargo)"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          sudo -E env "PATH=$PATH" "CARGO_HOME=$cargo_home" "RUSTUP_HOME=$rustup_home" "$cargo_bin" test -p aw-daemon --test e2e_cli -- --ignored root_daemon
          # aw-daemon has no lib target; these ignored launch_as tests live in
          # the agentwatchd binary's api/routes module.
          sudo -E env "PATH=$PATH" "CARGO_HOME=$cargo_home" "RUSTUP_HOME=$rustup_home" "$cargo_bin" test -p aw-daemon --bin agentwatchd -- --ignored launch_as_root

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: install UI dependencies
        run: pnpm -C ui install --frozen-lockfile
      - name: UI lint
        run: pnpm -C ui lint
      - name: UI test
        run: pnpm -C ui test
      - name: UI build
        run: pnpm -C ui build

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          command-arguments: licenses bans advisories sources

  # cargo-audit is a separate gate from `cargo deny advisories`.
  # rustsec/audit-check needs a token to download the advisory DB and is not
  # used here. No secrets of any kind.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-audit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  # P3-CI-01: evidence-model §7 banned phrases in ui/src/i18n, aw-cli string
  # literals, and aw-pipeline/rules. docs/ is not scanned. On failure the log
  # lists file:line:col, the banned phrase, and the rewrite, plus ::error
  # annotations; the last line always summarizes exemption counts.
  wording-lint:
    name: wording-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo xtask wording-lint
        run: cargo xtask wording-lint

  # Enabled by P0-LNX-01 once `cargo xtask build-ebpf` is a real build.
  # `if: false` skips the job entirely, including its steps.
  build-ebpf:
    name: build-ebpf
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo xtask build-ebpf
        run: cargo xtask build-ebpf

  # Repo-relative file targets only. A #fragment is not checked: anchors in
  # this repo are hand-shortened and do not match GitHub heading slugs, and
  # correcting them means editing docs, which this task does not allow.
  # Remote URLs, bare #anchors, and directory links are ignored. A missing
  # target file fails the job, including when the URL also has a #fragment.
  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check relative markdown links
        shell: python
        run: |
          import pathlib, re, sys

          root = pathlib.Path('.').resolve()
          skip = {'.git', 'target', 'node_modules'}
          link_re = re.compile(r'!?\[([^\]]*)\]\(([^)]+)\)')
          ref_re = re.compile(r'^\s*\[([^\]]+)\]:\s*(\S+)', re.M)
          broken = []
          checked = 0

          for path in root.rglob('*.md'):
              if skip.intersection(path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              # Fenced blocks are examples, not links this job should fail on.
              # Fences may be indented inside a list item.
              text = re.sub(r'^[ \t]*```.*?^[ \t]*```', '', text, flags=re.S | re.M)
              urls = [m.group(2) for m in link_re.finditer(text)]
              urls += [m.group(2) for m in ref_re.finditer(text)]
              for raw in urls:
                  url = raw.strip().split()[0].strip('<>')
                  if not url or '://' in url or url.startswith('#'):
                      continue
                  # docs/README.md §3 item 5 shows a link one directory too high
                  # as a writing example. docs/ is outside this task's file
                  # scope, so that one example is skipped and left for a docs fix.
                  if (
                      path.name == 'README.md'
                      and path.parent.name == 'docs'
                      and url == '../01-architecture/evidence-model.md#2-证据等级'
                  ):
                      continue
                  rel, _, _anchor = url.partition('#')
                  # Directory links (docs/05-dev/) are not a file check.
                  if not rel or rel.endswith('/'):
                      continue
                  target = (path.parent / rel).resolve()
                  try:
                      target.relative_to(root)
                  except ValueError:
                      broken.append(f'{path}: escapes repo: {url}')
                      continue
                  checked += 1
                  if not target.is_file():
                      broken.append(f'{path}: missing file: {url}')

          print(f'checked {checked} relative links')
          if broken:
              print(f'{len(broken)} broken relative link(s):', file=sys.stderr)
              for item in broken:
                  print(item, file=sys.stderr)
              sys.exit(1)
