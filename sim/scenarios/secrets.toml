# P2-SIM-01. Secrets-embedding scenario.
#
# Plants synthetic tokens — matching the patterns in crates/aw-pipeline/src/redact/engine.rs
# — into argv, environment-variable names, and URL query parameters.  The tokens are
# synthetically generated test values that match each rule's regex; they are NOT real
# credentials and have no access to any system.  They exist so collectors can observe
# the redaction pipeline removing them before the data lands in the store.
#
# Token catalogue (from engine.rs patterns):
#   tok.aws_akid     AKIAIOSFODNN7EXAMPLE          (AKIA + 16 uppercase alphanum)
#   tok.github       ghp_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA  (ghp_ + 36+ alphanum)
#   tok.github_pat   github_pat_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA (22+ alphanum/_)
#   tok.anthropic    sk-ant-api03-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA  (sk-ant- + 20+)
#   tok.openai       sk-proj-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA       (sk-proj- + 20+)
#   tok.slack        xoxt-111111111111-AAAAAAAAAAAAAAAA                  (xox[abprs]- + 10+)
#                    The prefix is xoxt- on purpose, not a real Slack prefix, so
#                    GitHub push protection does not flag the synthetic value.
#                    xoxt- still matches the redact rule for tok.slack.
#   tok.google_api   AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB               (AIza + 35 alphanum)
#   tok.stripe       sk_test_AAAAAAAAAAAAAAAA                            (sk_test_ + 16+)
#   tok.jwt          eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ0ZXN0In0.AAAAAAAAAAAAAAAAAAAAAAAAAAAA (header.payload.sig)
#   tok.bearer       Bearer AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA (bearer + 44+)
#
# Limit: exec steps run `sim argv-echo` so the OS sees the argv and immediately exits;
# no real service is contacted.  No sensitive path outside the temp root is accessed.
# These tokens appear in truth-line `argv` / extra fields for collector testing only.

name = "secrets"
description = "子进程 argv/env/URL 中嵌入各类合成密钥 token，供脱敏管道测试"

[setup]
# One small bait file for the URL-based step.
files = [
  { path = "work/data.bin", size = 128, content = "random" },
]
server = { http = true }

# ---------------------------------------------------------------------------
# 1. AWS AKID in argv
# ---------------------------------------------------------------------------
[[step]]
action = "spawn"
id = "aws-akid"
steps = [
  { action = "exec", id = "aws-akid-exec",
    argv = ["aws", "s3", "ls", "--access-key", "AKIAIOSFODNN7EXAMPLE"] },
]

# ---------------------------------------------------------------------------
# 2. GitHub PAT in argv
# ---------------------------------------------------------------------------
[[step]]
action = "spawn"
id = "github-pat"
steps = [
  { action = "exec", id = "github-pat-exec",
    argv = ["git", "clone",
            "https://ghp_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA@github.example.com/org/repo.git"] },
]

# ---------------------------------------------------------------------------
# 3. github_pat_ style in argv
# ---------------------------------------------------------------------------
[[step]]
action = "spawn"
id = "github-pat-v2"
steps = [
  { action = "exec", id = "github-pat-v2-exec",
    argv = ["gh", "auth", "login", "--with-token",
            "github_pat_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"] },
]

# ---------------------------------------------------------------------------
# 4. Anthropic key in argv
# ---------------------------------------------------------------------------
[[step]]
action = "spawn"
id = "anthropic-key"
steps = [
  { action = "exec", id = "anthropic-key-exec",
    argv = ["curl", "-H",
            "x-api-key: sk-ant-api03-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA",
            "https://127.0.0.1:{http_port}/upload"] },
]

# ---------------------------------------------------------------------------
# 5. OpenAI key in argv
# ---------------------------------------------------------------------------
[[step]]
action = "spawn"
id = "openai-key"
steps = [
  { action = "exec", id = "openai-key-exec",
    argv = ["curl", "-H",
            "Authorization: Bearer sk-proj-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA",
            "https://127.0.0.1:{http_port}/upload"] },
]

# ---------------------------------------------------------------------------
# 6. Slack token in argv
# ---------------------------------------------------------------------------
[[step]]
action = "spawn"
id = "slack-token"
steps = [
  { action = "exec", id = "slack-token-exec",
    argv = ["slack-cli", "--token", "xoxt-111111111111-AAAAAAAAAAAAAAAA", "post",
            "--channel", "#test"] },
]

# ---------------------------------------------------------------------------
# 7. Google API key in argv
# ---------------------------------------------------------------------------
[[step]]
action = "spawn"
id = "google-api-key"
steps = [
  { action = "exec", id = "google-api-exec",
    argv = ["gcloud", "--api-key", "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB",
            "compute", "instances", "list"] },
]

# ---------------------------------------------------------------------------
# 8. Stripe test key in argv
# ---------------------------------------------------------------------------
[[step]]
action = "spawn"
id = "stripe-test-key"
steps = [
  { action = "exec", id = "stripe-test-exec",
    argv = ["stripe", "listen", "--api-key", "sk_test_AAAAAAAAAAAAAAAA"] },
]

# ---------------------------------------------------------------------------
# 9. JWT in argv
# ---------------------------------------------------------------------------
[[step]]
action = "spawn"
id = "jwt-token"
steps = [
  { action = "exec", id = "jwt-exec",
    argv = ["curl", "-H",
            "Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ0ZXN0In0.AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA",
            "https://127.0.0.1:{http_port}/upload"] },
]

# ---------------------------------------------------------------------------
# 10. Bearer token in URL query parameter (query_name_secret: token=)
#     The URL goes to the local test listener; exec sees the argv.
# ---------------------------------------------------------------------------
[[step]]
action = "spawn"
id = "bearer-in-url"
steps = [
  { action = "exec", id = "bearer-url-exec",
    argv = ["curl",
            "http://127.0.0.1:{http_port}/download?token=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA&bytes=64"] },
]

# ---------------------------------------------------------------------------
# 11. Secret in a flag-value form  (--password=<secret>)
# ---------------------------------------------------------------------------
[[step]]
action = "spawn"
id = "flag-password"
steps = [
  { action = "exec", id = "flag-password-exec",
    argv = ["psql", "--password=not-a-real-pw-SIMBAIT",
            "postgresql://localhost/testdb"] },
]

# ---------------------------------------------------------------------------
# 12. URL with credentials in userinfo section
# ---------------------------------------------------------------------------
[[step]]
action = "spawn"
id = "url-userinfo"
steps = [
  { action = "exec", id = "url-userinfo-exec",
    argv = ["git", "remote", "add", "origin",
            "https://simbot:SIMBAIT-not-a-secret@git.example.com/repo.git"] },
]
