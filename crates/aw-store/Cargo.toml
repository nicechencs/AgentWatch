[package]
name = "aw-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "SQLite schema, migrations, and the batch writer."

[dependencies]
aw-core = { workspace = true }
# Pinned here on purpose (P0-STORE-01, moved to a normal dependency by P1-STORE-01).
# Do not add to the workspace table: root Cargo.toml is out of scope.
# `bundled` only — no sqlcipher, no OpenSSL, no `backup` feature.
rusqlite = { version = "0.32.1", features = ["bundled"] }

[[bench]]
name = "sqlite_throughput"
harness = false

[[bench]]
name = "product_ddl"
harness = false

[lints]
workspace = true
