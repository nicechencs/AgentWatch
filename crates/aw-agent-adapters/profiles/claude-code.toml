# 匹配规则依据任务卡草案，未经 SPIKE-07 实测，待核对。
# SPIKE-07（2026-10-07 文档调研）没有录到可用于识别的 argv；下面的路径只复述
# process-tracking §7 的草案，不把它写成已证实的进程形态。
# 渠道名来自同一篇文档调研（hooks、otel），不是本机实测。
# P5-AGENT-03 的注入首选是本次启动的 `--settings <临时文件>`（【待验证】，
# 未对真实 claude 二进制确认）。做不到时只给出手工片段，不写 ~/.claude/。
# P5-AGENT-04 在用户未设置 OTEL_EXPORTER_OTLP_ENDPOINT 时才注入端点；
# 变量名同样来自文档调研，【待验证】。

id = "claude-code"
display = "Claude Code"

# 放在 [children] 之前。写在该表后面且不换表头时，TOML 会把数组收进 children。
self_report = ["hooks", "otel"]

[match]
# 只认产品命令名。不把 node / python 放进 exe_names。
exe_names = ["claude", "claude.exe"]
# node 入口只在 argv 精确落到该包路径时才命中（与 exe_names 是“或”）。
argv_regex = [
    '(?i)(^|[\\/])@anthropic-ai[\\/]claude-code([\\/]|$)',
    '(?i)(^|[\\/])claude-code[\\/]cli\.js$',
]

[children]
# MCP 服务器名不在子进程 argv 里（SPIKE-07 §5.6）。下面只标命令行形态，
# 不把命中当成“已经证实这是 MCP”。identify 不读 role_regex。
role_regex = [
    { role = "mcp_server", regex = '(?i)(^|[\\/])mcp-server-[^\\/]+$' },
    { role = "mcp_server", regex = '(?i)(^|[\\/])npx(@[^\\/]+)?$' },
    { role = "mcp_server", regex = '(?i)@modelcontextprotocol[\\/]' },
]
