[package]
name = "aw-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "aw: command-line client. Talks to the daemon over its API."

[[bin]]
name = "aw"
path = "src/main.rs"

[dependencies]
aw-core = { workspace = true }
# Pinned in this crate (not workspace.dependencies): root Cargo.toml is out of
# scope for P1-CLI-01. Versions match crates that already use them.
# clap is MIT. serde and serde_json are MIT OR Apache-2.0.
# default-features are off so clap does not pull the `color` stack, and serde
# does not pull chrono.
clap = { version = "=4.5.31", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

[dev-dependencies]
# insta is MIT OR Apache-2.0. Same pin as aw-core. Snapshots record `aw --help`.
insta = { version = "1.49.0", default-features = false }

[lints]
workspace = true
