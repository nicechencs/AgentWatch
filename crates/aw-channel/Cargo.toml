[package]
name = "aw-channel"
# Explicit fields, not `workspace = true`: app/src-tauri (its own workspace)
# depends on this crate by path, and keeping the manifest self-contained means
# that build never needs the root workspace table.
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Internal-channel client shared by aw and the desktop app: socket/pipe path order, dial with error classes, one HTTP/1.1 exchange."

[features]
# Makes test-only pipe owner seams available to downstream integration tests.
test-support = ["aw-platform/test-support"]

[dependencies]

# The Windows client asks the platform boundary to validate the connected
# named-pipe server's token before it writes a request.  Keep Win32 FFI out of
# this std-only transport crate.
[target.'cfg(windows)'.dependencies]
aw-platform = { path = "../aw-platform" }

[target.'cfg(windows)'.dev-dependencies]
# Existing workspace crates, used only to create a real same-user named-pipe
# server for the client-side owner-rule tests.
aw-collector-windows = { path = "../aw-collector-windows" }
aw-platform = { path = "../aw-platform", features = ["test-support"] }
tokio = { version = "1.24.2", default-features = false, features = ["rt", "net", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
