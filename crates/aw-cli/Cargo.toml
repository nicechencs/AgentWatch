[package]
name = "aw-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "aw: command-line client. Talks to the daemon over its API."

[[bin]]
name = "aw"
path = "src/main.rs"

# P1-LNX-04. A lib target so `launch/unix_linux.rs` compiles and its tests run
# before P1-CLI-02 adds `mod unix_linux` to `launch/mod.rs` (that file is owned
# by the other card and must not gain a `mod` line from this one). The `aw` bin
# does not link this lib. Delete this target once `launch/mod.rs` registers the
# module; `src/lib.rs` re-exports only the Linux launch state machine.
[lib]
name = "aw_cli"
path = "src/lib.rs"

[dependencies]
aw-core = { workspace = true }
# Internal channel: path order, dial, error classes (shared with the app).
aw-channel = { workspace = true }
aw-store = { workspace = true }
aw-pipeline = { workspace = true }
aw-proxy = { workspace = true }
# Path crate already in the workspace. Not a new third-party dependency.
# Root Cargo.toml is not edited; this edge lets `aw hook` call `parse_hook`.
aw-agent-adapters = { workspace = true }
# Path crates already in the workspace. `aw daemon install` / `aw db purge --all`
# need to know whether the caller is an administrator; each platform crate owns
# that check (`privilege::is_privileged`), so this crate holds no platform code.
aw-collector-linux = { workspace = true }
aw-collector-macos = { workspace = true }
aw-collector-windows = { workspace = true }
# Pinned in this crate (not workspace.dependencies): root Cargo.toml is out of
# scope for P1-CLI-01. Versions match crates that already use them.
# clap is MIT. serde and serde_json are MIT OR Apache-2.0.
# default-features are off so clap does not pull the `color` stack, and serde
# does not pull chrono.
clap = { version = "=4.5.31", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

# Unix `aw run` holds the caller-created child at a pipe gate until the daemon
# has acknowledged `/adopt`. nix is MIT and keeps this fd work safe under the
# binary's `#![forbid(unsafe_code)]` policy.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# P1-CLI-02 / P1-WIN-04. Used only to hold a caller-created target at
# CREATE_SUSPENDED until the daemon accepts `/adopt`, then resume its primary
# thread. This pin matches aw-collector-windows and the existing lockfile.
windows = { version = "=0.57.0", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
# insta is MIT OR Apache-2.0. Same pin as aw-core. Snapshots record `aw --help`.
insta = { version = "1.49.0", default-features = false }

# Unsafe code is denied crate-wide. Two scoped, documented exceptions in
# `cmd::run`: the Unix `pre_exec` that keeps the pipe gate out of the target,
# and the Windows FFI that resumes a CREATE_SUSPENDED child after `/adopt`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
